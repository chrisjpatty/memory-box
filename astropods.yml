# yaml-language-server: $schema=https://astropods.ai/schema/package.json
spec: package/v1
name: memory-box
meta:
  visibility: public
agent:
  build:
    context: .
    dockerfile: Dockerfile
  inputs:
    # Admin password recovery. Leave empty in normal operation. To reset the
    # dashboard password, set this to a new, unique value and redeploy: on
    # startup the stored password is cleared so the next login prompts a fresh
    # setup. Fires once per distinct value — restarts and redeploys with the
    # same value are inert, so there is no sticky flag to remember to turn off.
    - name: PASSWORD_RESET_KEY
      datatype: string
      default: ""
      description: Set to a new unique value and redeploy to clear the admin password (next login prompts setup).
  interfaces:
    frontend: true
    messaging: false
models:
  anthropic:
    provider: anthropic

knowledge:
  db:
    provider: postgres
    inputs:
      - name: POSTGRES_DB
        datatype: string
        default: memory_box
  files:
    container:
      build:
        context: .
        dockerfile: minio.Dockerfile
      port: 9000
      volume: /data
  embeddings:
    container:
      image: mindthemath/nomic-embed-v1.5:slim
      port: 8080

dev:
  interfaces:
    frontend:
      port: 3001
